<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Fundo Marinho Koinon #002B5E com cantos arredondados ~20% -->
  <rect width="64" height="64" rx="14" fill="#002B5E"/>

  <!-- Símbolo Koinon Compacto (8 pontos) para 16–32px (Manual da Marca v1.0, págs. 4 e 9) -->
  <!-- Centro (32, 32), raio do anel 21 -->
  <!-- Ponto Central branco Ø10 (r=5) -->
  <circle cx="32" cy="32" r="5" fill="#FFFFFF"/>

  <!-- 4 Pontos Sólidos à Esquerda (Presencial) em Azul para fundo escuro #3D8BFF Ø8.8 (r=4.4) -->
  <!-- Ângulos: -112.5°, -157.5°, -202.5°, -247.5° a partir do centro (32, 32) -->
  <circle cx="23.97" cy="12.60" r="4.4" fill="#3D8BFF"/>
  <circle cx="12.60" cy="23.97" r="4.4" fill="#3D8BFF"/>
  <circle cx="12.60" cy="40.03" r="4.4" fill="#3D8BFF"/>
  <circle cx="23.97" cy="51.40" r="4.4" fill="#3D8BFF"/>

  <!-- 4 Pontos Vazados à Direita (Remoto) em Azul #3D8BFF Ø8.8 (r=4.4, traço 1.9, raio do centro 3.4) -->
  <!-- Ângulos: -67.5°, -22.5°, 22.5°, 67.5° a partir do centro (32, 32) -->
  <circle cx="40.03" cy="12.60" r="3.4" fill="none" stroke="#3D8BFF" stroke-width="2"/>
  <circle cx="51.40" cy="23.97" r="3.4" fill="none" stroke="#3D8BFF" stroke-width="2"/>
  <circle cx="51.40" cy="40.03" r="3.4" fill="none" stroke="#3D8BFF" stroke-width="2"/>
  <circle cx="40.03" cy="51.40" r="3.4" fill="none" stroke="#3D8BFF" stroke-width="2"/>
</svg>
